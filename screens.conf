# Kiosk screens — one per line:  key:script:refresh_seconds
#   key    = mode name (panel_mode.txt); renderer writes screens/<key>/panel.bgra
#   script = path (relative to this dir) to the screen renderer
#   refresh_seconds = re-render cadence WHILE shown (0 = never; on-arrival + 600s refresh-all still apply)
# Order = tap/auto-cycle order. Add a screen: mkdir screens/<key>, drop a script, add a line, restart.
weather:screens/weather/render_weather.py:0
salmon:screens/salmon/salmon_panel.py:0
cal:screens/cal/calendar_panel.py:0
news:screens/news/news_panel.py:310
pihole:screens/pihole/pihole_panel.py:310
releases:screens/releases/release_panel.py:120
deals:screens/deals/deal_panel.py:120
net:screens/net/net_panel.py:0
